<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookManager — Gestión de Biblioteca</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!--
        BookManager — Sistema de gestión de biblioteca digital

        Antes de modificar este archivo, revisar:
        → docs/guia-desarrollo.md (IDs, clases, estructura completa)
        → docs/backlog.md (criterios de aceptación de T-01a)
    -->

    <!-- T-01a: Encabezado -->
    <header class="encabezado">
        <h1>Gestor de Biblioteca Digital</h1>
    </header>

    <!-- T-01a: Contenido principal -->
    <main class="principal">

        <!-- Formulario de registro/edición -->
        <section class="formulario-seccion">
        </section>

        <!-- Buscador, filtros y ordenamiento -->
        <section class="controles-seccion">
        </section>

        <!-- Estadísticas del catálogo -->
        <section id="estadisticas" class="estadisticas-seccion">
        </section>

        <!-- Catálogo de libros (cards generadas por JS) -->
        <section class="catalogo-seccion">
            <div id="lista-libros" class="catalogo-grid">
                <!-- JS renderiza las cards aquí -->
            </div>
        </section>

    </main>

    <!-- T-01a: Pie de página -->
    <footer class="pie">
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
