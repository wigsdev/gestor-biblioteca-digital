<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookManager — Gestión de Biblioteca</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!--
        BookManager — Sistema de gestión de biblioteca digital

        Antes de modificar este archivo, revisar:
        → docs/guia-desarrollo.md (IDs, clases, estructura completa)
        → docs/backlog.md (criterios de aceptación de T-01a)
    -->

    <!-- T-01a: Header -->
    <header class="header">
    </header>

    <!-- T-01a: Main content -->
    <main class="main">

        <!-- Book form section -->
        <section class="form-section">
        </section>

        <!-- Search, filters and sort controls -->
        <section class="controls-section">
        </section>

        <!-- Catalog stats -->
        <section id="stats" class="stats-section">
        </section>

        <!-- Book catalog (cards rendered by JS) -->
        <section class="catalog-section">
            <div id="book-list" class="catalog-grid">
                <!-- JS renders book cards here -->
            </div>
        </section>

    </main>

    <!-- T-01a: Footer -->
    <footer class="footer">
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
